name: Update CBK rates

# Scrapes the Central Bank of Kenya "Key Rates" box and the latest indicative
# exchange rates, and commits any changes to data/key-rates.csv and
# data/forex.csv. The push triggers Cloudflare's build, so the live site
# updates itself — no manual step. Runs twice a day; you can also run it on
# demand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "0 6,13 * * *" # 06:00 & 13:00 UTC (09:00 & 16:00 EAT)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scrape CBK key rates and FX rates
        run: node Bengula-Jacob/scripts/scrape-cbk-rates.mjs

      # Runs even if one of the two scrapes failed, so the other still lands
      # (the job is still marked failed so the broken scrape gets noticed).
      - name: Commit & push if changed
        if: ${{ !cancelled() }}
        run: |
          FILES="Bengula-Jacob/data/key-rates.csv Bengula-Jacob/data/forex.csv"
          if git diff --quiet -- $FILES; then
            echo "No rate changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore: auto-update CBK rates"
            git push
          fi
