.tag{display:block;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

p{margin:0 0 16px;color:var(--muted)}
input{width:100%;font:inherit;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
button{margin-top:12px;width:100%;min-height:46px;font:inherit;font-weight:700;padding:10px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 8px 20px -10px rgb(91 33 182 / .7)}
