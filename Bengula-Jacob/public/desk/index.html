*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--ink);font:16px/1.5 Inter,"Helvetica Neue","Segoe UI",Helvetica,Arial,sans-serif;padding:16px;-webkit-font-smoothing:antialiased;
  background:radial-gradient(40rem 30rem at 100% -10%,var(--a1),transparent 60%),radial-gradient(36rem 28rem at -10% 10%,var(--a2),transparent 60%),radial-gradient(30rem 24rem at 50% 110%,var(--a3),transparent 60%),var(--bg)}
form{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:380px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{width:40px;height:40px;flex:none;display:grid;place-items:center;background:#fff;border:1px solid #E2E8F0;border-radius:8px;overflow:hidden}
.logo img{width:36px;height:36px}
.org{display:block;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
@media (prefers-color-scheme:dark){.org{color:#A78BFA}}
.tag{display:block;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{margin:0 0 4px;font:600 26px/1.15 Georgia,Charter,"Times New Roman",serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:2px}
@media (forced-colors:active){h1{background:none;color:CanvasText}}
p{margin:0 0 16px;color:var(--muted)}
.pwrow{position:relative}
input{width:100%;font:inherit;min-height:46px;padding:10px 52px 10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input::-ms-reveal,input::-ms-clear{display:none}
input:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
#eye{position:absolute;top:3px;right:3px;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
#eye:hover{color:var(--ink);background:color-mix(in srgb,var(--accent) 10%,transparent)}
#eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#eye .off{display:none}#eye[aria-pressed="true"] .on{display:none}#eye[aria-pressed="true"] .off{display:block}
#go{margin-top:12px;width:100%;min-height:46px;font:inherit;font-weight:700;padding:10px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 8px 20px -10px rgb(91 33 182 / .7)}
#go:disabled{opacity:.6;cursor:wait}#err{color:var(--danger);min-height:1.5em;margin:10px 0 0}

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const pw=document.getElementById('pw'),eye=document.getElementById('eye');
eye.addEventListener('click',()=>{
  const show=pw.type==='password'; pw.type=show?'text':'password';
  eye.setAttribute('aria-pressed',String(show));
  const l=show?'Hide password':'Show password'; eye.setAttribute('aria-label',l); eye.title=l;
  pw.focus();
});
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const go=document.getElementById('go'),err=document.getElementById('err');
  go.disabled=true;go.textContent='Unlocking…';err.textContent='';
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.salt),iterations:D.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},key,u(D.ct)));
    document.open();document.write(html);document.close();
  }catch(x){go.disabled=false;go.textContent='Unlock';err.textContent='Wrong password.';}
});
